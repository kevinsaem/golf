{% extends "base.html" %}
{% block content %}
<div class="text-center">
  <div class="text-4xl mb-2">⛳</div>
  <h1 class="text-lg font-extrabold text-slate-900">{{ rnd.title }}</h1>
  <p class="mt-1 text-sm text-slate-500">조편성에 참여해 주세요</p>
</div>

<h2 class="mt-7 mb-3 text-sm font-bold text-slate-500">본인 이름을 선택하세요</h2>
<form method="post" action="/r/{{ rnd.public_id }}/join" class="space-y-2">
  {% for p in rnd.participants %}
  <button type="submit" name="participant_id" value="{{ p.id }}"
    class="w-full text-left px-4 py-3 rounded-xl border font-medium transition border-slate-300 text-slate-800 active:bg-grass-50"
    {% if p.claimed %}onclick="return confirm('이미 등록된 이름이에요. 본인이 맞으면 이어서 진행할게요. 계속할까요?')"{% endif %}>
    {{ p.name }}
    {% if p.claimed %}<span class="text-xs float-right mt-0.5 text-slate-400">선택됨</span>{% endif %}
  </button>
  {% endfor %}
</form>
<p class="mt-4 text-xs text-slate-400 text-center">이미 선택된 이름도, 본인이면 다시 눌러 이어서 진행할 수 있어요.</p>
{% endblock %}
