{% extends "base.html" %}
{% block content %}
<a href="/" class="text-sm text-slate-400">← 뒤로</a>
<h1 class="mt-3 text-xl font-extrabold text-slate-900">새 라운딩 만들기</h1>

<form method="post" action="/rounds" class="mt-6 space-y-5">
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1.5">라운딩 이름</label>
    <input name="title" required placeholder="예: 3월 정기 라운딩"
      class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-grass-500 outline-none">
  </div>

  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1.5">몇 개 조로 나눌까요?</label>
    <input name="group_count" type="number" min="1" value="2" required
      class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-grass-500 outline-none">
    <p class="mt-1 text-xs text-slate-400">보통 4명이 한 조예요. 8명이면 2개 조.</p>
  </div>

  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1.5">자동 마감 시간</label>
    <select name="auto_close_minutes"
      class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-grass-500 outline-none bg-white">
      <option value="30">30분</option>
      <option value="60" selected>1시간</option>
      <option value="90">1시간 30분</option>
      <option value="120">2시간</option>
      <option value="150">2시간 30분</option>
      <option value="180">3시간</option>
    </select>
    <p class="mt-1 text-xs text-slate-400">첫 참가자가 순위를 낸 시점부터 이 시간이 지나면 <b>자동 마감</b>돼요. (그때까지 응답한 사람 기준으로 조편성 확정)</p>
  </div>

  <div>
    <div class="flex items-center justify-between mb-1.5">
      <label class="block text-sm font-semibold text-slate-700">참석자 명단</label>
      <button type="button" id="voiceBtn"
        class="hidden items-center gap-1 text-xs font-semibold text-grass-700 border border-grass-300 rounded-lg px-2.5 py-1 active:bg-grass-50">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        <span id="voiceLabel">음성으로 이름 추가</span>
      </button>
    </div>
    <textarea name="names" id="namesArea" rows="8" required placeholder="한 줄에 한 명씩 이름을 적어주세요&#10;홍길동&#10;김철수&#10;이영희 ..."
      class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-grass-500 outline-none"></textarea>
    <p class="mt-1 text-xs text-slate-400">주최자(본인)도 포함해서 적어주세요. <span id="voiceHint" class="hidden">음성 버튼을 누르고 이름을 또박또박 말하면 한 줄씩 추가돼요.</span></p>
  </div>

  <button type="submit" class="w-full bg-grass-600 text-white font-bold rounded-xl px-5 py-3.5 shadow-sm active:scale-[0.99] transition">
    만들고 공유 링크 받기
  </button>
</form>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var btn = document.getElementById('voiceBtn');
    var area = document.getElementById('namesArea');
    var label = document.getElementById('voiceLabel');
    var hint = document.getElementById('voiceHint');
    if (!SR || !btn) return;  // 미지원 브라우저면 버튼 숨김 유지(타이핑으로)
    btn.classList.remove('hidden');
    btn.classList.add('inline-flex');
    hint.classList.remove('hidden');

    var rec = null, listening = false;
    function appendNames(text) {
      var names = text.split(/[\s,·、]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!names.length) return;
      var cur = area.value.replace(/\s*$/, '');
      area.value = (cur ? cur + '\n' : '') + names.join('\n');
    }
    function stopUI() {
      listening = false;
      label.textContent = '음성으로 이름 추가';
      btn.classList.remove('bg-grass-100');
    }
    btn.addEventListener('click', function () {
      if (listening) { if (rec) rec.stop(); return; }
      rec = new SR();
      rec.lang = 'ko-KR';
      rec.continuous = true;
      rec.interimResults = false;
      rec.onresult = function (e) {
        for (var i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) appendNames(e.results[i][0].transcript);
        }
      };
      rec.onend = stopUI;
      rec.onerror = stopUI;
      try { rec.start(); } catch (err) { return; }
      listening = true;
      label.textContent = '듣는 중… (누르면 멈춤)';
      btn.classList.add('bg-grass-100');
    });
  })();
</script>
{% endblock %}
