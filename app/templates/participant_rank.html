{% extends "base.html" %}
{% block content %}
<div class="mb-4">
  <p class="text-xs text-slate-400">{{ rnd.title }}</p>
  <h1 class="text-lg font-extrabold text-slate-900">{{ me.name }}님의 희망 순위</h1>
  <p class="mt-1 text-sm text-slate-500">같이 치고 싶은 사람을 <b>위로</b> 끌어 올리세요.<br>맨 위가 1지망이에요. (길게 눌러서 드래그)</p>
</div>

<form method="post" action="/r/{{ rnd.public_id }}/rank" onsubmit="fillOrder()">
  <input type="hidden" name="order" id="order">
  <ul id="rankList" class="space-y-2">
    {% for o in others %}
    <li data-id="{{ o.id }}"
      class="flex items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-3.5 shadow-sm select-none touch-none">
      <span class="rank-badge flex-none w-7 h-7 rounded-full bg-grass-600 text-white text-sm font-bold grid place-items-center"></span>
      <span class="flex-1 font-medium text-slate-800">{{ o.name }}</span>
      <span class="text-slate-300 text-xl">≡</span>
    </li>
    {% endfor %}
  </ul>

  <button type="submit" class="mt-6 w-full bg-grass-600 text-white font-bold rounded-xl px-5 py-3.5 shadow-sm active:scale-[0.99] transition">
    이 순위로 제출하기
  </button>
</form>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
  const list = document.getElementById('rankList');
  function renumber() {
    [...list.children].forEach((li, i) => {
      li.querySelector('.rank-badge').textContent = i + 1;
    });
  }
  function fillOrder() {
    document.getElementById('order').value =
      [...list.children].map(li => li.dataset.id).join(',');
  }
  new Sortable(list, { animation: 150, onEnd: renumber });
  renumber();
</script>
{% endblock %}
